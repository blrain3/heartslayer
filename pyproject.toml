[build-system]
requires = ["flit_core>=3.9"]
build-backend = "flit_core.buildapi"

[project]
name = "heartslayer"
version = "0.1.0"
description = "Standalone Watcher bot for Slay the Spire — three keys → Act 4 → Corrupt Heart."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "blrain", email = "helloblrain@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "spirecomm>=0.3",
]

[project.scripts]
check-shops = "scripts.check-shops:main"

[tool.flit.module]
name = "scripts.check-shops"
